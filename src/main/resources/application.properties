spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones — límite servidor: 5 conexiones por usuario
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0

# ─────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update: crea tablas si no existen, actualiza si cambian
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────
# Inicializar datos de prueba SOLO si las tablas están vacías
# (controlado desde DataInitializer.java, NO desde data.sql)
# ─────────────────────────────────────────────────────────────────
spring.sql.init.mode=never

# ─────────────────────────────────────────────────────────────────
# Thymeleaf
# ─────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ─────────────────────────────────────────────────────────────────
# Sesión
# ─────────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.port=8080

# ─────────────────────────────────────────────────────────────────
# Subida de archivos
# ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
