<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title},~{::section})}">
<head><title>Mis Beneficios</title></head>
<body><section>
<div class="ph df jcb aic fw g2 mb3">
  <div><h4><i class="fas fa-trophy me1" style="color:var(--g3)"></i>Mis Beneficios Académicos</h4><p th:text="${alumno?.nombreCompleto}"></p></div>
  <a th:href="@{/estudiante/dashboard}" class="btn-o"><i class="fas fa-arrow-left me1"></i>Volver</a>
</div>
<div th:if="${#lists.isEmpty(resultados)}" class="data-card p3 tc tm"><i class="fas fa-info-circle" style="font-size:2rem;display:block;margin-bottom:10px;color:var(--gm)"></i>Aún no tienes beneficios académicos. Los beneficios se obtienen con puntaje Saber Pro ≥ 160 puntos.</div>
<div th:each="r:${resultados}" class="data-card mb3" style="border-left:4px solid var(--g1)">
  <div class="card-header" style="background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;border:none">
    <span><i class="fas fa-trophy me1"></i>Beneficio Saber Pro — Periodo: <span th:text="${r.periodo}"></span></span>
    <span class="lv-s" th:text="${r.nivel}"></span>
  </div>
  <div class="p3">
    <div class="row">
      <div class="c3"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase">Puntaje Global</div><div style="font-size:2rem;font-weight:800;color:var(--g1)" th:text="${r.puntajeGlobal}"></div></div>
      <div class="c9"><div style="font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:8px">Beneficio Otorgado</div>
        <div style="background:var(--gl);border-radius:10px;padding:14px"><div style="font-weight:700;color:var(--g1);font-size:.92rem;margin-bottom:6px"><i class="fas fa-award me1"></i><span th:text="${r.descripcionBeneficio}"></span></div>
          <div style="font-size:.78rem;color:var(--muted)">Fecha examen: <span th:text="${r.fechaExamen}"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</section></body></html>
