<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title},~{::section})}">
<head><title>Último Resultado</title></head>
<body><section>
<div class="ph df jcb aic fw g2 mb3">
  <div><h4><i class="fas fa-star me1" style="color:var(--g3)"></i>Mi Último Resultado — TyT &amp; Saber Pro</h4><p th:text="${alumno?.nombreCompleto + ' — CC: ' + alumno?.cedula}"></p></div>
  <a th:href="@{/estudiante/dashboard}" class="btn-o"><i class="fas fa-arrow-left me1"></i>Volver</a>
</div>
<div class="row">
  <div class="c6"><div class="data-card">
    <div class="card-header" style="background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;border:none"><i class="fas fa-file-alt me1"></i>Último Resultado TyT</div>
    <div th:if="${ultimoTyt != null}" class="p3">
      <div style="text-align:center;background:var(--gl);border-radius:12px;padding:20px;margin-bottom:14px">
        <div style="font-size:.8rem;color:var(--g1)">Puntaje Global</div>
        <div style="font-size:3rem;font-weight:800;color:var(--g1);line-height:1" th:text="${ultimoTyt.puntajeGlobal}"></div>
        <div style="margin-top:6px"><span th:text="${ultimoTyt.nivel}" th:classappend="${'Superior'.equals(ultimoTyt.nivel)?'lv-s':('Alto'.equals(ultimoTyt.nivel)?'lv-a':('Medio'.equals(ultimoTyt.nivel)?'lv-m':'lv-b'))}"></span></div>
        <div style="font-size:.77rem;color:var(--muted);margin-top:6px" th:text="${'Periodo: ' + (ultimoTyt.periodo ?: '—')}"></div>
      </div>
      <div class="row g2">
        <div class="c6 mb2"><div style="background:#f5faf5;border-radius:8px;padding:10px"><div style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase">Lectura y Escritura</div><div style="font-size:1.2rem;font-weight:800" th:text="${ultimoTyt.lecturaEscritura ?: '—'}"></div></div></div>
        <div class="c6 mb2"><div style="background:#f5faf5;border-radius:8px;padding:10px"><div style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase">Razonamiento</div><div style="font-size:1.2rem;font-weight:800" th:text="${ultimoTyt.razonamientoCuantitativo ?: '—'}"></div></div></div>
        <div class="c6"><div style="background:#f5faf5;border-radius:8px;padding:10px"><div style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase">Ciudadanas</div><div style="font-size:1.2rem;font-weight:800" th:text="${ultimoTyt.competenciasCiudadanas ?: '—'}"></div></div></div>
        <div class="c6"><div style="background:#f5faf5;border-radius:8px;padding:10px"><div style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase">Inglés</div><div style="font-size:1.2rem;font-weight:800" th:text="${ultimoTyt.ingles ?: '—'}"></div></div></div>
      </div>
    </div>
    <div class="p3 tc tm" th:unless="${ultimoTyt != null}"><i class="fas fa-info-circle me1"></i>Sin resultado TyT registrado</div>
  </div></div>
  <div class="c6"><div class="data-card">
    <div class="card-header" style="background:linear-gradient(135deg,#1a4b8b,#2980b9);color:#fff;border:none"><i class="fas fa-graduation-cap me1"></i>Último Resultado Saber Pro</div>
    <div th:if="${ultimoSaberPro != null}" class="p3">
      <div style="text-align:center;background:#e3f2fd;border-radius:12px;padding:20px;margin-bottom:14px">
        <div style="font-size:.8rem;color:#1a4b8b">Puntaje Global</div>
        <div style="font-size:3rem;font-weight:800;color:#1a4b8b;line-height:1" th:text="${ultimoSaberPro.puntajeGlobal}"></div>
        <div style="margin-top:6px"><span th:text="${ultimoSaberPro.nivel}" th:classappend="${'Superior'.equals(ultimoSaberPro.nivel)?'lv-s':('Alto'.equals(ultimoSaberPro.nivel)?'lv-a':('Medio'.equals(ultimoSaberPro.nivel)?'lv-m':'lv-b'))}"></span></div>
        <div style="font-size:.77rem;color:var(--muted);margin-top:6px" th:text="${'Periodo: ' + (ultimoSaberPro.periodo ?: '—')}"></div>
      </div>
      <div th:if="${ultimoSaberPro.tieneBeneficio()}" style="background:var(--gl);border-radius:10px;padding:12px;text-align:center;margin-bottom:10px">
        <i class="fas fa-trophy" style="color:var(--g1);font-size:1.2rem"></i>
        <div style="font-weight:700;color:var(--g1);margin-top:4px">Beneficio Obtenido</div>
        <div style="font-size:.8rem;color:var(--muted);margin-top:3px" th:text="${ultimoSaberPro.descripcionBeneficio}"></div>
      </div>
    </div>
    <div class="p3 tc" th:unless="${ultimoSaberPro != null}">
      <div th:unless="${alumno?.aprobadoTyt}" style="color:#b71c1c;padding:20px"><i class="fas fa-lock" style="font-size:1.8rem;display:block;margin-bottom:8px;opacity:.4"></i>Bloqueado — Requiere TyT aprobada primero</div>
      <div th:if="${alumno?.aprobadoTyt}" class="tm" style="padding:20px">Sin resultado Saber Pro aún</div>
    </div>
  </div></div>
</div>
</section></body></html>
