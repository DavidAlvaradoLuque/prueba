<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title},~{::section})}">
<head><title>Todos mis Resultados</title></head>
<body><section>
<div class="ph df jcb aic fw g2 mb3">
  <div><h4><i class="fas fa-chart-line me1" style="color:var(--g3)"></i>Todos mis Resultados</h4><p th:text="${alumno?.nombreCompleto + ' — CC: ' + alumno?.cedula}"></p></div>
  <a th:href="@{/estudiante/dashboard}" class="btn-o"><i class="fas fa-arrow-left me1"></i>Volver</a>
</div>
<div class="data-card mb3">
  <div class="card-header" style="background:var(--gl)"><i class="fas fa-file-alt me1" style="color:var(--g1)"></i>Resultados TyT <span class="b-tyt" th:text="${#lists.size(resultadosTyt) + ' resultado(s)'}"></span></div>
  <div class="p0"><table class="table">
    <thead><tr><th>Periodo</th><th>Fecha</th><th>Global</th><th>Lectura</th><th>Razonamiento</th><th>Ciudadanas</th><th>Inglés</th><th>Nivel</th></tr></thead>
    <tbody>
      <tr th:each="r:${resultadosTyt}">
        <td th:text="${r.periodo ?: '—'}"></td><td style="font-size:.78rem" th:text="${r.fechaExamen ?: '—'}"></td>
        <td class="fb" th:text="${r.puntajeGlobal}"></td><td th:text="${r.lecturaEscritura ?: '—'}"></td>
        <td th:text="${r.razonamientoCuantitativo ?: '—'}"></td><td th:text="${r.competenciasCiudadanas ?: '—'}"></td>
        <td th:text="${r.ingles ?: '—'}"></td>
        <td><span th:text="${r.nivel}" th:classappend="${'Superior'.equals(r.nivel)?'lv-s':('Alto'.equals(r.nivel)?'lv-a':('Medio'.equals(r.nivel)?'lv-m':'lv-b'))}"></span></td>
      </tr>
      <tr th:if="${#lists.isEmpty(resultadosTyt)}"><td colspan="8" class="tc tm" style="padding:20px">Sin resultados TyT</td></tr>
    </tbody>
  </table></div>
</div>
<div class="data-card">
  <div class="card-header" style="background:#e3f2fd"><i class="fas fa-graduation-cap me1" style="color:#1a4b8b"></i>Resultados Saber Pro <span class="b-sp" th:text="${#lists.size(resultadosSp) + ' resultado(s)'}"></span></div>
  <div th:unless="${alumno?.aprobadoTyt}" class="a-wa" style="margin:12px"><i class="fas fa-lock me1"></i>Para presentar Saber Pro debes tener TyT aprobada.</div>
  <div class="p0"><table class="table">
    <thead><tr><th>Periodo</th><th>Fecha</th><th>Global</th><th>Lectura</th><th>Razonamiento</th><th>Ciudadanas</th><th>Inglés</th><th>Específico</th><th>Nivel</th><th>Beneficio</th></tr></thead>
    <tbody>
      <tr th:each="r:${resultadosSp}">
        <td th:text="${r.periodo ?: '—'}"></td><td style="font-size:.78rem" th:text="${r.fechaExamen ?: '—'}"></td>
        <td class="fb" th:text="${r.puntajeGlobal}"></td><td th:text="${r.lecturaEscritura ?: '—'}"></td>
        <td th:text="${r.razonamientoCuantitativo ?: '—'}"></td><td th:text="${r.competenciasCiudadanas ?: '—'}"></td>
        <td th:text="${r.ingles ?: '—'}"></td><td th:text="${r.componenteEspecifico ?: '—'}"></td>
        <td><span th:text="${r.nivel}" th:classappend="${'Superior'.equals(r.nivel)?'lv-s':('Alto'.equals(r.nivel)?'lv-a':('Medio'.equals(r.nivel)?'lv-m':'lv-b'))}"></span></td>
        <td style="font-size:.73rem" th:text="${r.descripcionBeneficio}"></td>
      </tr>
      <tr th:if="${#lists.isEmpty(resultadosSp)}"><td colspan="10" class="tc tm" style="padding:20px">Sin resultados Saber Pro</td></tr>
    </tbody>
  </table></div>
</div>
</section></body></html>
